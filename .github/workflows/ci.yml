name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # AudioReactive.swift uses SDK 26 APIs behind runtime availability checks.
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build:desktop
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app
      - if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: WallSoul-${{ runner.os }}-unsigned
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/wallsoul.exe
